<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crackers Icon | Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:Arial,sans-serif}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 5%;background:#151c2b;color:#fff}.top h1{font-size:22px;margin:0}.top button,.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700;background:#e7b943;color:#171717}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.notice{padding:12px;border-radius:8px;background:#fff3cd;margin-bottom:16px}.grid{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:20px}.panel{background:#fff;border:1px solid #e0e5ee;border-radius:12px;padding:18px;box-shadow:0 4px 18px #14203a0a}.panel h2{margin-top:0;font-size:19px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input,textarea,select{width:100%;padding:10px;border:1px solid #ccd4e1;border-radius:7px;font:inherit}textarea{min-height:70px;resize:vertical}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.secondary{background:#e8edf5;color:#172033}.danger{background:#b92d3b;color:white}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e6eaf1;vertical-align:top}th{background:#f7f8fb}.small{font-size:12px;color:#637087}.status{min-height:22px;color:#8b2530;margin-top:10px}@media(max-width:850px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.formrow{grid-template-columns:1fr}}
</style></head><body><header class="top"><h1>Crackers Icon · Admin Dashboard</h1><button id="logout">Sign out</button></header><main class="wrap"><div id="notice" class="notice">Checking admin access…</div><div class="grid"><section class="panel"><h2 id="formTitle">Add product</h2><form id="productForm"><input type="hidden" id="productId"><label for="name">Product name *</label><input id="name" required maxlength="180"><label for="description">Description</label><textarea id="description"></textarea><div class="formrow"><div><label for="price">Price (₹) *</label><input id="price" type="number" min="0" step="0.01" required></div><div><label for="stock">Stock quantity *</label><input id="stock" type="number" min="0" step="1" required value="0"></div></div><label for="category">Category</label><input id="category"><label for="image">Image URL</label><input id="image" type="url" placeholder="https://…"><label for="available">Availability</label><select id="available"><option value="true">Available</option><option value="false">Unavailable</option></select><div class="actions"><button class="btn" type="submit">Save product</button><button class="btn secondary" id="clear" type="button">Clear</button></div><div class="status" id="formStatus" role="status"></div></form></section><section class="panel"><h2>Products</h2><p class="small">Changes are saved to Supabase. The public store will only show database products after its storefront is connected to Supabase.</p><div class="actions"><button class="btn secondary" id="refresh" type="button">Refresh products</button></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody id="productsBody"><tr><td colspan="5">Loading…</td></tr></tbody></table></div><div class="status" id="listStatus" role="status"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const db=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);const $=id=>document.getElementById(id);let rows=[];
async function guard(){const {data:{session},error}=await db.auth.getSession();if(error||!session){location.href='admin-login.html';return false;}const {data:admin,error:ae}=await db.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();if(ae||!admin){await db.auth.signOut();location.href='admin-login.html';return false;}$('notice').textContent='Signed in as '+session.user.email+' · Admin access verified';return true;}
function clearForm(){$('productForm').reset();$('productId').value='';$('stock').value='0';$('formTitle').textContent='Add product';$('formStatus').textContent='';}
function editProduct(p){$('productId').value=p.id;$('name').value=p.name||'';$('description').value=p.description||'';$('price').value=p.price??0;$('stock').value=p.stock_quantity??0;$('category').value=p.category||'';$('image').value=p.image_url||'';$('available').value=String(p.is_available!==false);$('formTitle').textContent='Edit product #'+p.id;window.scrollTo({top:0,behavior:'smooth'});}
async function loadProducts(){ $('productsBody').innerHTML='<tr><td colspan="5">Loading…</td></tr>';const {data,error}=await db.from('products').select('*').order('id',{ascending:false});if(error){$('productsBody').innerHTML='';$('listStatus').textContent='Could not load products: '+error.message;return;}rows=data||[];$('listStatus').textContent=rows.length+' products';$('productsBody').innerHTML='';if(!rows.length){$('productsBody').innerHTML='<tr><td colspan="5">No products in Supabase yet.</td></tr>';return;}for(const p of rows){const tr=document.createElement('tr');const name=document.createElement('td');name.textContent=p.name;const price=document.createElement('td');price.textContent='₹'+Number(p.price||0).toFixed(2);const stock=document.createElement('td');stock.textContent=p.stock_quantity??0;const status=document.createElement('td');status.textContent=p.is_available?'Available':'Hidden';const actions=document.createElement('td');const edit=document.createElement('button');edit.className='btn secondary';edit.textContent='Edit';edit.onclick=()=>editProduct(p);const del=document.createElement('button');del.className='btn danger';del.textContent='Delete';del.style.marginLeft='5px';del.onclick=()=>deleteProduct(p);actions.append(edit,del);tr.append(name,price,stock,status,actions);$('productsBody').append(tr);}}
$('productForm').addEventListener('submit',async e=>{e.preventDefault();$('formStatus').textContent='Saving…';const p={name:$('name').value.trim(),description:$('description').value.trim(),price:Number($('price').value),stock_quantity:Number($('stock').value),category:$('category').value.trim(),image_url:$('image').value.trim(),is_available:$('available').value==='true',updated_at:new Date().toISOString()};const id=$('productId').value;const result=id?await db.from('products').update(p).eq('id',Number(id)):await db.from('products').insert(p);if(result.error){$('formStatus').textContent='Save failed: '+result.error.message;return;}$('formStatus').textContent='Saved successfully.';clearForm();await loadProducts();});
async function deleteProduct(p){if(!confirm('Delete “'+p.name+'”? This cannot be undone.'))return;const {error}=await db.from('products').delete().eq('id',p.id);if(error){$('listStatus').textContent='Delete failed: '+error.message;return;}await loadProducts();}
$('clear').onclick=clearForm;$('refresh').onclick=loadProducts;$('logout').onclick=async()=>{await db.auth.signOut();location.href='admin-login.html';};
(async()=>{if(await guard())await loadProducts();})();
</script></body></html>
