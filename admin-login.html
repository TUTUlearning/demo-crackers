<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crackers Icon | Admin Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101522;color:#f7f7fb;font-family:Arial,sans-serif;padding:20px}.card{width:min(440px,100%);background:#1b2334;border:1px solid #35405a;border-radius:18px;padding:30px;box-shadow:0 20px 60px #0005}h1{margin:0 0 8px}p{color:#b8c2d9;line-height:1.5}label{display:block;margin:18px 0 7px}input{width:100%;padding:13px;border-radius:9px;border:1px solid #47536b;background:#0f1522;color:white;font-size:16px}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#e9b949;color:#171717;font-weight:700;font-size:16px;cursor:pointer}#msg{min-height:24px;color:#ffd1d1;font-size:14px}.hint{font-size:12px;color:#aab4ca}a{color:#f2ce75}
</style></head><body><main class="card"><h1>Crackers Icon</h1><p>Owner Admin Login</p><form id="loginForm"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in securely</button></form><p><a href="#" id="forgotPassword">Forgot password?</a></p><p id="msg" role="status"></p><p class="hint">Access is checked against the admin_users table. Do not share your password.</p><p><a href="index.html">Back to store</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);
const form=document.getElementById('loginForm'), msg=document.getElementById('msg');
document.getElementById('forgotPassword').addEventListener('click',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim();if(!email){msg.textContent='Enter your account email above first.';return;}msg.textContent='Sending password reset email…';const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/reset-password.html'});msg.textContent=error?'Could not send reset email: '+error.message:'If this email belongs to an account, a password reset link has been sent. Check your inbox and spam folder.';});
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in…';const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){msg.textContent='Login failed: '+error.message;return;}const {data:admin,error:adminError}=await client.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();if(adminError||!admin){await client.auth.signOut();msg.textContent='This account is not authorized as an admin.';return;}location.href='admin.html';});
client.auth.getSession().then(async({data})=>{if(data.session){const {data:admin}=await client.from('admin_users').select('user_id').eq('user_id',data.session.user.id).maybeSingle();if(admin)location.href='admin.html';}});
</script></body></html>
