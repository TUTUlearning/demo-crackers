<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crackers Icon | Reset Password</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101522;color:#f7f7fb;font-family:Arial,sans-serif;padding:20px}.card{width:min(440px,100%);background:#1b2334;border:1px solid #35405a;border-radius:18px;padding:30px}h1{margin:0 0 8px}p{color:#b8c2d9;line-height:1.5}label{display:block;margin:18px 0 7px}input{width:100%;padding:13px;border-radius:9px;border:1px solid #47536b;background:#0f1522;color:white;font-size:16px}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#e9b949;color:#171717;font-weight:700;font-size:16px;cursor:pointer}#msg{min-height:24px;color:#ffd1d1;font-size:14px}a{color:#f2ce75}</style></head><body><main class="card"><h1>Set a new password</h1><p>Enter your new password below.</p><form id="resetForm"><label for="password">New password (at least 8 characters)</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button type="submit">Update password</button></form><p id="msg" role="status"></p><p><a href="admin-login.html">Back to login</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);const form=document.getElementById('resetForm'),msg=document.getElementById('msg');client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY')msg.textContent='Recovery link verified. Set your new password.';});form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<8){msg.textContent='Use at least 8 characters.';return;}if(p!==c){msg.textContent='Passwords do not match.';return;}msg.textContent='Updating password…';const {error}=await client.auth.updateUser({password:p});if(error){msg.textContent='Could not update password: '+error.message;return;}form.reset();msg.textContent='Password updated. You can now sign in with the new password.';setTimeout(()=>location.href='admin-login.html',1800);});</script></body></html>
